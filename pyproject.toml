[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jig-studio"
version = "2.0.0"
description = "AI-powered Christian Content Studio"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }

authors = [
    { name = "Ali" }
]

keywords = [
    "ai",
    "christian",
    "facebook",
    "reels",
    "video",
    "automation",
    "groq",
    "ffmpeg",
    "python"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "httpx>=0.28.1",
    "beautifulsoup4>=4.13.4",
    "lxml>=6.0.0",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.10.1",
    "sqlalchemy>=2.0.43",
    "loguru>=0.7.3",
    "apscheduler>=3.11.0",
    "tenacity>=9.1.2",
    "moviepy>=2.2.1",
    "opencv-python>=4.12.0.88",
    "pillow>=11.3.0",
    "numpy>=2.2.6",
    "imageio>=2.37.0",
    "imageio-ffmpeg>=0.6.0",
    "python-dotenv>=1.1.1",
    "rich>=14.1.0",
    "click>=8.2.1"
]

[project.optional-dependencies]

dev = [
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "ruff>=0.12.7",
    "black>=25.1.0",
    "mypy>=1.17.1",
    "pre-commit>=4.2.0"
]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM"
]

ignore = [
    "E501"
]

[tool.pytest.ini_options]
testpaths = [
    "tests"
]

pythonpath = [
    "."
]

addopts = "-ra -q"

[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.coverage.run]
source = [
    "app"
]

[tool.coverage.report]
show_missing = true
skip_covered = true
